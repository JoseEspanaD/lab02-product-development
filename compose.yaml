name: ${COMPOSE_PROJECT_NAME:-lab02}

x-app: &app
  image: lab02-product-development:0.3.0
  build: .
  environment: &environment
    DATABASE_URL: postgresql://${POSTGRES_USER:-lab02}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-lab02}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_NAME: novamercado
    MODEL_ALIAS: champion
    MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
    MLFLOW_ARTIFACT_UPLOAD_DOWNLOAD_TIMEOUT: "10"
    MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
    MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "true"
    SOURCE_REVISION: ${SOURCE_REVISION:-no-proporcionada}

services:
  postgres:
    image: postgres:16.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab02}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-lab02}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/backend.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow:*,localhost:*,127.0.0.1:*
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  bootstrap:
    <<: *app
    command: ["python", "-m", "novamercado.bootstrap"]
    environment:
      <<: *environment
      DATA_DIR: /data
      BOOTSTRAP_VALIDATION_END: ${BOOTSTRAP_VALIDATION_END:-2025-11-16}
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "on-failure:3"

  api:
    <<: *app
    environment:
      <<: *environment
      MODEL_CACHE_DIR: /cache
    volumes:
      - model_cache:/cache
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

# Airflow y su PostgreSQL independiente se incorporarán en Fase 4.
# No compartir postgres_data ni el DSN del producto con Airflow.
volumes:
  postgres_data:
  mlflow_data:
  model_cache:
